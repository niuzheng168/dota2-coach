"309.28" font-size="14" fill="#183044">内侧中野 · 9</text><circle cx="379.632" cy="321.081171875" r="14" fill="#146c83"/><text x="379.632" y="326.081171875" text-anchor="middle" fill="white" font-size="15">C</text><text x="334.632" y="354.081171875" font-size="14" fill="#183044">水生营地 · 4</text><circle cx="574.016763671875" cy="184.17946484375" r="14" fill="#2d5270"/><text x="574.016763671875" y="189.17946484375" text-anchor="middle" fill="white" font-size="15">D</text><text x="546.016763671875" y="161.17946484375" font-size="14" fill="#183044">下侧中野 · 15</text><circle cx="879.5172578125" cy="153.26902343749998" r="14" fill="#2d5270"/><text x="879.5172578125" y="158.26902343749998" text-anchor="middle" fill="white" font-size="15">E</text><text x="829.5172578125" y="128.26902343749998" font-size="14" fill="#183044">下路附近大野 · 2</text><circle cx="804.38672265625" cy="301.972375" r="14" fill="#2d5270"/><text x="804.38672265625" y="306.972375" text-anchor="middle" fill="white" font-size="15">F</text><text x="764.38672265625" y="333.972375" font-size="14" fill="#183044">下路小野 · 1</text><text x="915" y="100" font-size="15" fill="#183044">↑ 北</text><text x="45" y="420" font-size="18" fill="#183044">主干：A → B → C → D；刷新后可 D → C → B → A</text><text x="45" y="453" font-size="18" fill="#183044">可选支路：D → E → F → D（内侧尚未刷新时比较，不强制绕行）</text><text x="45" y="487" font-size="15" fill="#455965">370 移速、静态步行：A→D 约 17.5 秒；D→E→F→D 约 23.9 秒</text><text x="45" y="513" font-size="14" fill="#455965">这些是走路耗时，不含清野、等待、转身或引野；没有计入水流加速。</text><text x="45" y="539" font-size="14" fill="#455965">C 为水生营地：组合会进化，当前普通中野收益不能直接套用。回访必须核实刷新。</text></g></svg>
